<title>Cobuildy Investor Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* Layout: three cards on a warm ground. Left: agent conversation. Centre: matches, mandate, deal review, pipeline. Right: mandate strength, proposals waiting for approval, access steps. Same ink / off-white / site-plan blue identity as the Cobuildy site; semantic green, amber, red only for state. */
:root{
  --bg:#f3f1ec; --surface:#ffffff; --soft:#f9f9f6; --ink:#100f0f; --ink-2:#5b5954; --line:#e5e3dd;
  --plan:#1d3fd1; --plan-soft:#e8ecfb;
  --good:#1f7a4d; --good-soft:#e2f1e8; --warn:#9a6a12; --warn-soft:#f6ecd6; --bad:#b3261e; --bad-soft:#f9e3e1;
  --f-display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e0d; --surface:#181816; --soft:#1f1f1c; --ink:#f3f2ee; --ink-2:#a9a79f; --line:#2c2b28;
  --plan:#8ea2ff; --plan-soft:#20264a; --good:#6fcf9b; --good-soft:#15291e; --warn:#e0b45a; --warn-soft:#2c2412; --bad:#f08a82; --bad-soft:#331a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0e0d; --surface:#181816; --soft:#1f1f1c; --ink:#f3f2ee; --ink-2:#a9a79f; --line:#2c2b28;
  --plan:#8ea2ff; --plan-soft:#20264a; --good:#6fcf9b; --good-soft:#15291e; --warn:#e0b45a; --warn-soft:#2c2412; --bad:#f08a82; --bad-soft:#331a18; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,p{margin:0;font-weight:400}
:focus-visible{outline:2px solid var(--plan);outline-offset:2px;border-radius:8px}
.mono{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.muted{color:var(--ink-2)}
.serif{font-family:var(--f-display)}

.app{height:100%;display:flex;flex-direction:column;gap:12px;max-width:1720px;margin:0 auto}
/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-height:44px}
.logo{font-family:var(--f-display);font-size:26px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.logo i{width:12px;height:12px;border:1.5px solid var(--plan);position:relative;display:inline-block}
.logo i::after{content:"";position:absolute;inset:2.5px;background:var(--plan)}
.crumb{color:var(--ink-2);display:flex;gap:8px;align-items:center;min-width:0}
.crumb b{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font:500 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);color:var(--ink-2);background:var(--surface)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.plan{background:var(--plan-soft);color:var(--plan);border-color:transparent}
.btn{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13.5px}
.btn:hover{border-color:var(--ink-2)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{height:28px;padding:0 11px;font-size:12.5px}
.vnav{display:none}

/* columns */
.cols{display:grid;grid-template-columns:minmax(330px,0.9fr) minmax(0,1.6fr) minmax(300px,0.85fr);grid-template-rows:minmax(0,1fr);gap:12px;min-height:0;flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{overflow:auto;min-height:0;flex:1}

/* chat */
.stages{display:flex;gap:4px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.stg{flex:1;min-width:0}
.stg i{display:block;height:4px;border-radius:3px;background:var(--line)}
.stg.done i{background:var(--ink)} .stg.now i{background:var(--plan)}
.stg span{display:block;margin-top:6px;font:500 10px var(--f-mono);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg.now span{color:var(--plan)}
.stg-head{padding:12px 16px 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.msgs{padding:16px;display:flex;flex-direction:column;gap:14px}
.m{max-width:92%;display:flex;flex-direction:column;gap:6px}
.m.u{align-self:flex-end;align-items:flex-end}
.m .b{padding:9px 13px;border-radius:16px;white-space:pre-wrap}
.m.a .b{background:var(--soft);border:1px solid var(--line);border-top-left-radius:6px}
.m.u .b{background:var(--ink);color:var(--bg);border-top-right-radius:6px}
.who{font:500 10.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.who i{width:9px;height:9px;border:1.4px solid var(--plan);display:inline-block;position:relative}
.who i::after{content:"";position:absolute;inset:1.5px;background:var(--plan)}
.saved{display:flex;flex-wrap:wrap;gap:5px}
.saved button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink-2)}
.saved button b{color:var(--good);font-weight:600;margin-right:4px}
.saved button:hover{border-color:var(--plan);color:var(--ink)}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-2);animation:dot 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:10px;background:var(--surface)}
.asking{display:flex;justify-content:space-between;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;text-align:left}
.chip:hover{border-color:var(--plan)}
.chip.doc{border-color:var(--plan);color:var(--plan);background:var(--plan-soft)}
.chip.un{color:var(--ink-2);border-style:dashed;background:transparent}
.inrow{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;background:var(--soft);color:var(--ink);padding:10px 12px;font:inherit;min-height:44px;max-height:110px}
.send{height:44px;width:44px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:18px;flex:none}
.send:disabled{opacity:.4;cursor:default}
.mode{font-size:12px;color:var(--ink-2);display:flex;gap:8px;align-items:center;justify-content:space-between}
.mode label{display:flex;gap:6px;align-items:center;cursor:pointer}

/* main */
.tabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{white-space:nowrap;border:0;background:transparent;padding:9px 14px;border-radius:10px 10px 0 0;color:var(--ink-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kpi{background:var(--surface);padding:12px 14px;min-width:0}
.kpi .v{font:400 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v.na{color:var(--ink-2)}
.kpi .l{font:500 10.5px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin-top:3px}
.kpi .s{font-size:12px;color:var(--ink-2)}
.content{padding:16px;display:grid;gap:14px;align-content:start}
.sec{border:1px solid var(--line);border-radius:16px;overflow:hidden;scroll-margin-top:8px}
.sec-h{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.sec-h h3{font:400 22px var(--f-display);letter-spacing:-.01em}
.bar{flex:0 0 70px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.row{display:grid;grid-template-columns:20px minmax(110px,0.8fr) minmax(0,1.6fr) 86px;gap:4px 12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:start}
.row:last-child{border-bottom:0}
.row .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;margin-top:1px;border:1.5px solid var(--line);color:var(--ink-2)}
.row .ic.f{background:var(--good);border-color:var(--good);color:var(--bg)}
.row .ic.p{border-color:var(--warn);color:var(--warn)}
.row .ic.u{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.row .lab{color:var(--ink-2)}
.row .val{min-width:0;overflow-wrap:anywhere}
.row .val.empty{color:var(--ink-2);font-style:italic}
.row .src{display:block;font:400 11px var(--f-mono);color:var(--ink-2);margin-top:2px}
.row .src.doc{color:var(--plan)}
.row .gap{display:block;font-size:12.5px;color:var(--warn);margin-top:2px}
.row .act{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:12px;padding:2px 10px;white-space:nowrap}
.row .act:hover{border-color:var(--plan);color:var(--plan)}
.row.flash{animation:fl 2.4s ease-out}
@keyframes fl{0%{background:var(--plan-soft)}100%{background:transparent}}
.su{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:8px}
.su-bar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line)}
.su-bar span{display:block;height:100%}
.su-leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2)}
.su-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}

/* ready panel */
.verdict{padding:18px 18px 14px;display:grid;gap:14px;border-bottom:1px solid var(--line)}
.vtop{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:92px;height:92px;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font:400 30px var(--f-display);font-variant-numeric:tabular-nums}
.vtxt h2{font:400 24px/1.1 var(--f-display);letter-spacing:-.01em;margin:6px 0 4px}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.ladder div{font:500 10px var(--f-mono);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.ladder i{display:block;height:6px;border-radius:3px;background:var(--line);margin-bottom:5px}
.ladder .on i{background:var(--good)} .ladder .on{color:var(--ink)}
.blk{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.blk h3{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:start;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--soft);text-align:left;width:100%}
.item:hover{border-color:var(--plan)}
.item b{font-weight:500}
.item p{grid-column:1/-1;font-size:12.5px;color:var(--ink-2)}
.item.flag{background:var(--bad-soft);border-color:transparent}
.item.todo{grid-template-columns:22px 1fr}
.item.todo .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:500 12px var(--f-mono)}
.item .meta{grid-column:2;font:400 11px var(--f-mono);color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap}
.secbars{display:grid;gap:7px}
.sb{display:grid;grid-template-columns:112px 1fr 34px;gap:8px;align-items:center;font-size:13px;background:transparent;border:0;padding:0;text-align:left}
.sb:hover b{color:var(--plan)}
.sb .bar{flex:1;height:6px}
.sb em{font:500 11px var(--f-mono);font-style:normal;color:var(--ink-2);text-align:right}
.disc{padding:12px 18px 16px;font-size:12px;color:var(--ink-2)}


/* match strip: always visible */
.matchbar{display:flex;align-items:center;gap:18px;padding:10px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;flex:none}
.mb-main{display:flex;align-items:center;gap:12px;min-width:0;flex:0 1 auto}
.mb-n{font:400 40px/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.mb-n small{font:400 17px var(--f-display);color:var(--ink-2);margin-left:5px}
.mb-t{display:grid;gap:1px;min-width:0}
.mb-t b{font-weight:500}
.mb-t span{font-size:12.5px;color:var(--ink-2)}
.mb-mid{flex:1;min-width:140px;display:grid;gap:6px}
.mb-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);gap:2px}
.mb-bar span{display:block;min-width:3px}
.mb-bar .f,.mb-leg .f{background:var(--good)}.mb-bar .p,.mb-leg .p{background:var(--plan)}.mb-bar .l,.mb-leg .l{background:var(--warn)}.mb-bar .o,.mb-leg .o{background:var(--ink-2);opacity:.35}
.mb-leg{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.mb-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

/* investors */
.note-line{font-size:12.5px;color:var(--ink-2)}
.fseg{display:flex;gap:6px;flex-wrap:wrap}
.fseg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:500;font-size:13px;display:flex;gap:8px;align-items:center}
.fseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fseg b{font:500 11px var(--f-mono)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--soft);display:grid;gap:8px;align-content:start}
.box h3{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.box li{margin:0 0 4px;list-style:none;display:flex;gap:8px;justify-content:space-between;align-items:baseline;font-size:13.5px}
.box ul{margin:0;padding:0}
.box li b{font:500 12px var(--f-mono);color:var(--plan);white-space:nowrap}
.box li button{background:none;border:0;padding:0;text-align:left;color:inherit}
.box li button:hover{color:var(--plan)}
.inv{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.inv-h{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:12px 14px;width:100%;text-align:left;background:none;border:0}
.inv-h:hover{background:var(--soft)}
.inv-h b{font-weight:500;font-size:15px}
.inv-h .meta{grid-column:1/-1;font-size:12.5px;color:var(--ink-2)}
.inv-b{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:12px;background:var(--soft)}
.inv-b h4{margin:0 0 6px;font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.ck{display:grid;grid-template-columns:18px 1fr;gap:8px;font-size:13px;padding:2px 0}
.ck i{font-style:normal;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;margin-top:2px}
.ck .pass{background:var(--good);color:var(--bg)} .ck .fail{background:var(--bad);color:var(--bg)} .ck .unk{border:1.5px solid var(--warn);color:var(--warn)}
.ck em{font-style:normal;color:var(--ink-2)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* outreach */
.banner{border-radius:16px;padding:14px 16px;display:grid;gap:6px}
.banner.good{background:var(--good-soft)}.banner.warn{background:var(--warn-soft)}.banner.bad{background:var(--bad-soft)}
.banner b{font-weight:500;font-size:15px}
.seq{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.sq{border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--soft);display:grid;gap:4px;align-content:start}
.sq.now{border-color:var(--plan);background:var(--plan-soft)}
.sq.done{border-color:var(--good)}
.sq b{font-weight:500;font-size:13.5px}
.sq p{font-size:12px;color:var(--ink-2)}
.tz{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tz-h{padding:11px 14px;background:var(--soft);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tz-b{padding:14px 16px;display:grid;gap:10px}
.tz-b h3{font:400 24px/1.15 var(--f-display)}
.tz-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 22px;font-size:13.5px}
.tz-grid div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.tz-grid span:first-child{color:var(--ink-2)}
.tz-f{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:10px;background:var(--soft)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.wave{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wave-h{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:11px 14px;background:var(--soft);border-bottom:1px solid var(--line)}
.wave-h h3{font:400 22px var(--f-display)}
.wl{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.wchip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;background:var(--surface);display:flex;gap:8px;align-items:center}
.wchip.x{text-decoration:line-through;color:var(--ink-2);background:transparent}
.wchip button{border:0;background:none;color:var(--ink-2);padding:0;font-size:14px;line-height:1}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bcol{border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:10px;display:grid;gap:7px;align-content:start;min-height:110px}
.bcol h4{margin:0;font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:12.5px}
.bcard b{font-weight:500;display:block}
.bcard span{color:var(--ink-2)}

/* roadmap */
.rm-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.rm-sum>div{border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:var(--soft)}
.rm-sum .v{font:400 24px/1.1 var(--f-display)}
.gwrap{border:1px solid var(--line);border-radius:16px;overflow:auto}
.gchart{min-width:760px}
.grow{display:grid;grid-template-columns:270px 1fr;border-bottom:1px solid var(--line);align-items:center}
.grow:last-child{border-bottom:0}
.grow.head{background:var(--soft);position:sticky;top:0;z-index:1}
.gl{padding:6px 12px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;text-align:left;width:100%}
.gl:hover{color:var(--plan)}
.gt{position:relative;height:30px;
  background:linear-gradient(var(--g1c),var(--g1c)) var(--g1) 0/1px 100% no-repeat,linear-gradient(var(--g2c),var(--g2c)) var(--g2) 0/1px 100% no-repeat,linear-gradient(var(--g3c),var(--g3c)) var(--g3) 0/1px 100% no-repeat}
.gb{position:absolute;top:7px;height:16px;border-radius:5px;background:var(--line);border:0;padding:0;min-width:4px}
.gb.c{background:var(--plan)}

<script>

/* ---------- illustrative live projects (fictional) ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  const ltc=ins==='equity'?+rr(.3,.5).toFixed(2):+rr(.45,.75).toFixed(2);
  PRJ.push({id:'P-'+String(i+1).padStart(2,'0'),geo,city:pick(CITY[geo]),as,ins,ask,ltc,cost:Math.round(ask/ltc/5e4)*5e4,lic:pick([2,2,2,1,1,0]),margin:+rr(.14,.32).toFixed(2),
    track:Math.round(rr(1,12)),units:Math.round(rr(6,40)),pre:as==='RES'?+rr(.05,.6).toFixed(2):null,ret:ins==='equity'?Math.round(rr(15,24)):Math.round(rr(8,13)),

const NOWY=2026;

   listed:[0,1,2].slice(0,Math.max(1,Math.min(3,p.track))).map(i=>({n:CITY[p.geo][i%CITY[p.geo].length]+' '+['Residences','Gardens','Court'][i],yr:2025-i*2,units:Math.round(p.units*(1.1-i*.25)),gdv:Math.max(2,Math.round(vol/Math.max(1,p.track)*(1.3-i*.3)))}))}}

 {k:'type',s:'profile',l:'Investor type',w:1,q:'Do you invest as a private investor or family office, or as an institutional lender or fund?',chips:()=>[{l:'Private investor / family office',v:'priv'},{l:'Institutional lender / fund',v:'inst'}]},

  if(s==='short')acts.push(`<button class="btn2 pri" data-act="interest" data-id="${p.id}" type="button">Express interest</button><button class="btn2" data-act="pass" data-id="${p.id}" type="button">Pass</button>`);
  if(s==='interest'){const ok=A.decl&&A.kyc;
    if(!ok)acts.push(`<div style="flex:1 0 100%;border:1px solid var(--plan);border-radius:12px;padding:10px 12px;background:var(--plan-soft);display:grid;gap:8px"><b style="font-weight:500">Before you sign the NDA, two quick steps (simulated)</b><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="pill ${A.decl?'good':''}">${A.decl?'✓ ':'1 '}Qualified investor declaration</span>${A.decl?'':`<button class="btn2 plan" data-act="decl" type="button">Declare I am a qualified investor</button>`}</div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="pill ${A.kyc?'good':''}">${A.kyc?'✓ ':'2 '}Identity check</span>${A.kyc?'':`<button class="btn2 ${A.decl?'plan':''}" data-act="kyc" type="button" ${A.decl?'':'disabled'}>Run identity check</button>`}</div></div>`);
    acts.push(`<button class="btn2 plan" data-act="nda" data-id="${p.id}" type="button" ${ok?'':'disabled'}>Sign NDA and open the data room</button><button class="btn2" data-act="pass" data-id="${p.id}" type="button">Pass</button>`)}
  if(s==='room')acts.push(`<button class="btn2 plan" data-act="sendq" data-id="${p.id}" type="button">Send ${plural((st.qs&&st.qs.length)||0,'question')} to the sponsor</button>`);
  if(s==='qa')acts.push(`<button class="btn2" data-act="simr" data-id="${p.id}" type="button">Simulate the sponsor’s answers</button>`);
  if(s==='answered')acts.push(`<button class="btn2 plan" data-act="decide" data-id="${p.id}" type="button">Request a term sheet discussion</button><button class="btn2" data-act="pass" data-id="${p.id}" type="button">Pass</button>`);
  if(s==='decision')acts.push(`<span class="pill good">Introduction requested</span>`);
  if(s==='passed')acts.push(`<button class="btn2" data-act="short" data-id="${p.id}" type="button">Reopen</button>`);
  return `<div class="tz"><div class="tz-h"><span class="mono">${p.id} · ${esc(pname(p))}</span><span class="pill ${x.bucket==='match'?'':'plan'}">Fit ${x.fit}%</span></div>
  <div class="tz-b"><h3>${esc(pname(p))}, ${INS[p.ins].toLowerCase()} ${eur(p.ask)}</h3>${flowBar(p.id)}
  <div class="tz-grid">${money.map(m=>`<div><span>${m[0]}</span><span>${esc(m[1])}</span></div>`).join('')}</div></div>
  <div class="tz-f"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${acts.join('')}</div>${s==='passed'?`<div class="chips"><span class="note-line">Tell the agent why, so it learns:</span>${['Price','Sponsor','Risk','Not my mandate'].map(r=>`<button class="chip ${st.reason===r?'doc':''}" data-act="reason" data-id="${p.id}" data-r="${r}" type="button">${r}</button>`).join('')}</div>`:''}</div></div>
  <div class="cols2"><div class="box"><h3>Fit with your mandate</h3>${x.c.length?x.c.map(c=>`<div class="ck"><i class="${c.r==='pass'?'pass':c.r==='fail'?'fail':'unk'}">${c.r==='pass'?'✓':c.r==='fail'?'✕':'?'}</i><span>${esc(c.l)} <em>· ${esc(c.d)}</em></span></div>`).join(''):'<span class="muted">Set your mandate to see the check.</span>'}</div>
  <div class="box"><h3>Agent’s read</h3><ul style="display:grid;gap:8px">${read.map(r=>`<li style="display:block;font-size:13.5px">${esc(r)}</li>`).join('')}</ul></div></div>
  <div class="sec"><div class="sec-h"><h3>Sponsor</h3><span class="mono muted">${room?'Identity revealed under the NDA':'Anonymous until the NDA'}</span></div><div class="content" style="padding:12px;display:grid;gap:8px">${spCard(sponsorOf(p),room)}${known('track')?`<p class="note-line">${p.track>=V.track?'Meets':'Below'} your requirement of ${V.track}+ delivered projects.</p>`:''}</div></div>
  <div class="sec"><div class="sec-h"><h3>Data room</h3><span class="mono muted">${room?'Open':'Locked until you sign the NDA'}</span></div><div class="doc-list" style="border:0;border-radius:0">${docs.map(d=>`<div class="doc-row"><span>${d.d}</span><span class="${d.ok?'':'muted'}">${room?(d.ok?'Received':'Missing, requested by agent'):'Hidden'}</span><span class="lk">${room?'':'Locked'}</span></div>`).join('')}</div></div>
  <div class="sec"><div class="sec-h"><h3>Questions for the sponsor</h3><span class="mono muted">Drafted by the agent · you approve</span></div><div class="content" style="padding:12px">
   ${['room','qa','answered','decision'].includes(s)||s==='interest'||s==='short'||s==='new'?`<div class="qs">${qs.map((q,i)=>{const sent=['qa','answered','decision'].includes(s);const on=sent?(st.qs||[]).includes(i):(st.qs||[]).includes(i);return `<label><input type="checkbox" ${on?'checked':''} ${sent||s!=='room'?'disabled':''} data-act="qchk" data-id="${p.id}" data-i="${i}"><span>${esc(q)}${s==='answered'||s==='decision'?`<div class="qa-a">${on?'Sponsor: '+['Confirmed in writing, uploaded to the data room.','Documents attached. Fallback plan shared.','Will confirm after the next site meeting.','Provided references for two comparable projects.'][i%4]:''}</div>`:''}</span></label>`}).join('')}</div>
   <p class="note-line" style="margin-top:8px">${s==='room'?'Tick the questions to send, then confirm above.':s==='qa'?'Sent. Waiting for the sponsor.':s==='answered'||s==='decision'?'':'Questions unlock after the NDA and the data room.'}</p>`:''}
  </div></div>`}
function renderPipe(){
  const cols=[['Shortlisted',['short','interest']],['Diligence',['room','qa','answered']],['Decision',['decision']],['Passed',['passed']]];
  const items=Object.keys(P).filter(id=>P[id].status!=='new');
  if(!items.length)return `<div class="empty">Your pipeline is empty. Shortlist a project in Matches to start.</div>`;
  return `<p class="note-line">Every move is yours. The agent prepares the next step and waits for your confirmation.</p><div class="board">${cols.map(([n,ss])=>{const l=items.filter(id=>ss.includes(P[id].status));return `<div class="bcol"><h4>${n}<span>${l.length}</span></h4>${l.map(id=>{const p=byId(id);return `<button class="bcard" style="text-align:left;width:100%" data-act="open" data-id="${id}" type="button"><b>${esc(pname(p))}</b><span>${eur(p.ask)} · ${FLOWN[P[id].status]}</span></button>`}).join('')}</div>`}).join('')}</div>`}
function renderMandate(){
  const mt=match(),sum=[];
  if(V.type)sum.push(V.type==='priv'?'private investor':'institutional lender');
  const bits=['ins','geo','asset','tk','stage'].filter(known).map(k=>({ins:'writes '+fmt('ins').toLowerCase(),geo:'in '+fmt('geo'),asset:'for '+fmt('asset').toLowerCase(),tk:'ticket '+fmt('tk'),stage:fmt('stage').toLowerCase()}[k]));
  return `<p class="note-line">${bits.length?'I look for: '+esc((sum.concat(bits)).join(', '))+'.':'The mandate is empty. Answer in the chat and it fills here.'}</p>`+SECS.map(([id,name])=>{
    const fs=F.filter(f=>f.s===id),done=fs.filter(f=>STt[f.k]==='filled'||STt[f.k]==='na').length;
    return `<div class="sec" id="s-${id}"><div class="sec-h"><h3>${name}</h3><span class="bar"><i style="width:${done/fs.length*100}%"></i></span><span class="mono muted">${done}/${fs.length}</span></div>`+fs.map(f=>{
      const st=STt[f.k],v=fmt(f.k),ic=st==='filled'?'f':st==='na'?'':st==='unknown'?'u':'';
      return `<div class="row ${justSaved===f.k?'flash':''}" id="f-${f.k}"><span class="ic ${ic}">${st==='filled'?'✓':st==='unknown'?'!':''}</span><span class="lab">${f.l}</span><span class="val ${v?'':'empty'}">${v?esc(v):st==='unknown'?'Not sure yet':'Not answered'}${mt.unlock[f.k]?`<span class="gap">Relaxing this adds ${plural(mt.unlock[f.k],'project')}</span>`:''}</span>${st==='na'?'<span></span>':`<button class="act" data-act="ask" data-k="${f.k}" type="button">${st==='filled'?'Change':'Answer'}</button>`}</div>`}).join('')+'</div>'}).join('')}
let justSaved=null;
function renderMain(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.t===tab));
  renderKpis();
  $('#content').innerHTML=tab==='feed'?renderFeed():tab==='deal'?renderDeal():tab==='pipe'?renderPipe():renderMandate();
  save()}

/* proposals: the agent recommends, the human confirms */
function props(){
  const out=[],mt=match();
  const top=mt.m.find(x=>stOf(x.p.id)==='new'&&x.fit>=80);
  if(top)out.push({id:'sl:'+top.p.id,h:`Shortlist ${top.p.id} · ${pname(top.p)}`,d:`Fit ${top.fit}% and nothing outside your mandate.`,a:'short',pid:top.p.id,b:'Approve'});
  Object.keys(P).forEach(id=>{const s=P[id].status,p=byId(id);
    if(s==='interest')out.push({id:'nda:'+id,h:`Sign the NDA for ${id}`,d:'Opens the data room. Needs your investor declaration and identity check.',a:'nda',pid:id,b:'Sign NDA'});
    if(s==='room'&&(P[id].qs||[]).length)out.push({id:'q:'+id,h:`Send ${plural(P[id].qs.length,'question')} to the sponsor of ${id}`,d:'Drafted from the flags I found.',a:'sendq',pid:id,b:'Send'});
    if(s==='answered')out.push({id:'ts:'+id,h:`Request a term sheet discussion for ${id}`,d:'Answers are in. I recommend a call with the sponsor.',a:'decide',pid:id,b:'Request'})});
  return out.filter(x=>!dismissed.includes(x.id)).slice(0,4)}
function renderReady(){
  const c=clarity(),mt=match(),C=2*Math.PI*40,off=C*(1-c.score/100),pr=props();
  const hints=Object.entries(mt.unlock).sort((a,b)=>b[1]-a[1]).slice(0,2),open=F.filter(f=>open_(f.k)).length;
  const acc=[['Qualified investor declaration','You confirm you invest in your own name or for a firm and understand the risks.',A.decl,'decl','Declare'],['Identity and source-of-funds check','Simulated here. The full product uses a regulated provider.',A.kyc,'kyc','Run check']];
  $('#ready').innerHTML=`<div class="verdict"><div class="vtop"><div class="ring"><svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="40" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="46" cy="46" r="40" fill="none" stroke="var(--plan)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><div class="n">${c.score}</div></div>
  <div class="vtxt"><span class="mono muted">Mandate clarity</span><h2>${LEVEL[c.level]}</h2><span class="note-line">Draft index, not a rating</span></div></div>
  <div class="ladder">${['Mandate','Screening','Sharp','Access'].map((n,i)=>`<div class="${(i===0&&c.score>0)||(i===1&&c.level>=1)||(i===2&&c.level>=2)||(i===3&&A.decl&&A.kyc)?'on':''}"><i></i>${n}</div>`).join('')}</div></div>
  <div class="blk"><h3>Waiting for your approval <span>${pr.length}</span></h3>${pr.length?pr.map(x=>`<div class="item todo"><span class="n">!</span><div><b>${esc(x.h)}</b><p style="font-size:12.5px;color:var(--ink-2)">${esc(x.d)}</p><div style="display:flex;gap:6px;margin-top:6px"><button class="btn2 pri" data-act="prop" data-id="${x.id}" type="button">${x.b}</button><button class="btn2" data-act="dismiss" data-id="${x.id}" type="button">Not now</button></div></div></div>`).join(''):'<p class="note-line">Nothing waiting. I will propose the next step when there is one.</p>'}</div>
  <div class="blk"><h3>Sharpen your mandate</h3>${hints.map(([k,n])=>`<button class="item" data-act="ask" data-k="${k}" type="button"><b>Relax “${esc(FK[k].l)}”</b><span class="pill plan">+${n}</span><p>${plural(n,'project')} miss only on this criterion.</p></button>`).join('')}${open?`<p class="note-line">${open} open ${open===1?'criterion':'criteria'}. Open criteria never exclude a project.</p>`:''}${!hints.length&&!open?'<p class="note-line">Nothing to sharpen right now.</p>':''}</div>
  <div class="blk"><h3>Access <span>Prototype</span></h3>${acc.map((a,i)=>`<div class="acc ${a[2]?'ok':''}"><span class="n">${a[2]?'✓':i+1}</span><b style="font-weight:500">${a[0]}</b>${a[2]?'<span class="pill">Done</span>':`<button class="btn2" data-act="${a[3]}" type="button">${a[4]}</button>`}<small>${a[1]}</small></div>`).join('')}<div class="acc"><span class="n">3</span><b style="font-weight:500">NDA for each project</b><span class="stp muted">${Object.values(P).filter(p=>['room','qa','answered','decision'].includes(p.status)).length} signed</span><small>Signed per project. Opens that data room only.</small></div></div>
  <div class="blk"><h3>Agent log</h3><div class="logl">${LOG.length?LOG.slice(0,6).map(l=>`<div><time>${String(new Date(l.at).getHours()).padStart(2,'0')}:${String(new Date(l.at).getMinutes()).padStart(2,'0')}</time><span>${esc(l.t)}</span></div>`).join(''):'<span class="note-line">No actions yet.</span>'}</div></div>
  <p class="disc">Prototype with fictional projects. The agent recommends and prepares. You confirm every step. Nothing is sent or signed for real. Cobuildy is an introducer and does not give investment advice.</p>`}
function renderAll(){renderStages();renderStrip();renderChat();renderMain();renderReady()}

/* ---------- pipeline actions (all simulated, all confirmed by a click) ---------- */
function openDeal(id){sel=id;tab='deal';renderMain();if(innerWidth<=1180)setView('main')}
function needAccess(){if(A.decl&&A.kyc)return false;toast('Complete the two access steps first');return true}
function act(a,id){
  const p=byId(id);
  if(a==='short'){pset(id,{status:'short'});log(`Shortlisted ${id}`)}
  else if(a==='pass'){pset(id,{status:'passed'});log(`Passed on ${id}`)}
  else if(a==='interest'){pset(id,{status:'interest'});log(`Interest registered for ${id}. The sponsor sees your mandate summary only after the NDA.`)}
  else if(a==='nda'){if(needAccess()){renderReady();return}pset(id,{status:'room',qs:flagsOf(p).concat([1]).slice(0,4).map((_,i)=>i)});log(`NDA signed for ${id}. Data room open.`)}
  else if(a==='sendq'){if(!(P[id].qs||[]).length){toast('Tick at least one question');return}pset(id,{status:'qa'});log(`${plural(P[id].qs.length,'question')} sent to the sponsor of ${id}`)}
  else if(a==='simr'){pset(id,{status:'answered'});log(`Sponsor of ${id} answered`)}
  else if(a==='decide'){pset(id,{status:'decision'});log(`Term sheet discussion requested for ${id}. Cobuildy arranges the call.`)}
  renderAll()}

/* ---------- presets ---------- */
function resetState(){V={};STt={};M=[];cur=null;tmp=[];P={};A={decl:false,kyc:false};LOG=[];dismissed=[];sel=null;filter='all';tab='feed'}
async function preset(kind){
  resetState();busy=true;isTyping=false;
  if(kind==='priv'){setF('type','priv');setF('geo',['CS','LIS']);setF('asset',['RES','BTR']);setF('ins',['mezz','equity']);setF('tk',{lo:1e6,hi:3e6});setF('stage',1);setF('ltc',.7);setF('ret',12);setF('term',36);
    M.push({r:'a',t:'Hi, I am your Cobuildy agent. Tell me where, what and how much you invest. I screen live projects against your mandate and you decide what to do with them.',saved:[]},{r:'u',t:'I am a family office. Mezzanine and equity in Costa del Sol and Lisbon, residential and build-to-rent, tickets of €1–3M, permit at least submitted.'},{r:'a',t:'Thanks, I saved your regions, asset types, instruments, ticket size and stage. I am screening now. Two more questions will sharpen the matches.',saved:savedChips(['geo','asset','ins','tk','stage'])})}
  else{setF('type','inst');setF('geo',['CS','BCN','MAD','LIS']);setF('asset',['RES','BTR']);setF('ins',['senior']);setF('tk',{lo:3e6,hi:1e7});setF('stage',2);setF('ltc',.7);setF('ret',9);setF('term',24);setF('track',3);setF('margin',.18);
    M.push({r:'a',t:'Hi, I am your Cobuildy agent. Tell me where, what and how much you invest. I screen live projects against your mandate and you decide what to do with them.',saved:[]},{r:'u',t:'We are a credit fund. Senior loans in Costa del Sol, Barcelona, Madrid and Lisbon, residential and build-to-rent, tickets of €3–10M, permit granted only, LTC up to 70%, return at least 9%, up to 24 months, sponsors with 3+ projects.'},{r:'a',t:'Thanks, your mandate is almost complete. I am screening now.',saved:savedChips(['geo','asset','ins','tk','stage','ltc','ret','term','track'])})}
  tab='feed';busy=false;renderAll();await ask(nextField()?nextField().k:null);renderAll()}
async function scratch(){
  resetState();busy=true;isTyping=false;
  M.push({r:'a',t:'Hi, I am your Cobuildy agent. Tell me about your mandate in your own words, or answer one question at a time. I screen live projects as we go. I recommend, you decide.',saved:[]});
  renderAll();await ask('type');busy=false;renderAll()}

/* ---------- persistence ---------- */
const KEY='cobuildy-inv-ws-v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({V,STt,M,cur,tab,sel,filter,P,A,LOG,dismissed}))}catch(_){}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(!j||!j.STt||!j.M)return false;
  V=j.V||{};STt=j.STt;M=j.M;cur=j.cur||null;tab=j.tab||'feed';sel=j.sel||null;filter=j.filter||'all';P=j.P||{};A=j.A||{decl:false,kyc:false};LOG=j.LOG||[];dismissed=j.dismissed||[];return true}catch(_){return false}}

/* ---------- events ---------- */
function setView(v){$('#app').dataset.view=v;document.querySelectorAll('.vnav button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v))}
function send(){const t=$('#inp').value.trim();if(!t||busy)return;$('#inp').value='';answer(t,null)}
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
document.addEventListener('change',e=>{const b=e.target.closest('[data-act="qchk"]');if(!b)return;const id=b.dataset.id,i=+b.dataset.i,q=new Set(P[id].qs||[]);b.checked?q.add(i):q.delete(i);pset(id,{qs:[...q]});renderMain();renderReady()});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='tab'){tab=b.dataset.t;renderMain();if(innerWidth<=1180)setView('main')}
  else if(a==='view')setView(b.dataset.v);
  else if(a==='send')send();
  else if(a==='chip'){const c=curChips()[+b.dataset.i];if(!c||busy)return;
    if(c.go==='top'){const t=match().m[0];if(t)openDeal(t.p.id);else toast('No matches yet')}
    else if(c.go==='near'){filter='near';tab='feed';renderMain();if(innerWidth<=1180)setView('main')}
    else if(c.go==='change')answer('Change my mandate',c);
    else if(c.go==='cont'){if(tmp.length){const f=FK[cur];answer(f.chips().filter(x=>tmp.includes(x.v)).map(x=>x.l).join(', '),{v:[...tmp]})}}
    else if(FK[cur]&&FK[cur].multi&&c.v!==undefined){tmp=tmp.includes(c.v)?tmp.filter(x=>x!==c.v):[...tmp,c.v];renderChat()}
    else answer(c.l,c)}
  else if(a==='jump'){tab='mandate';renderMain();if(innerWidth<=1180)setView('main');const r=$('#f-'+b.dataset.k);if(r){r.scrollIntoView({block:'center',behavior:'smooth'});justSaved=b.dataset.k;r.classList.add('flash');setTimeout(()=>justSaved=null,2400)}}
  else if(a==='ask'){if(busy)return;if(innerWidth<=1180)setView('chat');busy=true;tmp=[];const k=b.dataset.k;delete STt[k];renderChat();ask(k,'Let’s update this one.').then(()=>{busy=false;renderAll()})}
  else if(a==='open')openDeal(id);
  else if(['short','pass','interest','nda','sendq','simr','decide'].includes(a))act(a,id);
  else if(a==='filter'){filter=b.dataset.f;renderMain()}
  else if(a==='reason'){pset(id,{reason:b.dataset.r});log(`Noted why you passed on ${id}: ${b.dataset.r.toLowerCase()}. I will weigh this in future matches.`);renderAll()}
  else if(a==='prop'){const x=props().find(y=>y.id===id);if(x)act(x.a,x.pid)}
  else if(a==='dismiss'){dismissed.push(id);renderAll()}
  else if(a==='decl'){A.decl=true;log('Qualified investor declaration confirmed');renderAll()}
  else if(a==='kyc'){if(!A.decl){toast('Confirm the declaration first');return}A.kyc=true;log('Identity check passed (simulated)');renderAll()}
  else if(a==='presetP')preset('priv');
  else if(a==='presetI')preset('inst');
  else if(a==='reset')scratch();
});
if(load()){busy=false;renderAll()}else preset('priv');
</script>
